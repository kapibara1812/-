<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>チャート知識帳</title>
<meta name="theme-color" content="#1f2430" />
<meta name="description" content="ダウ理論・グランビルの法則・エリオット波動・酒田五法・ローソク足パターン・PPPなど、チャート分析の知識を図解付きで検索できるアプリ" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>📊 チャート知識帳</h1>
    <div class="search-box">
      <input id="search-input" type="search" inputmode="search" placeholder="キーワードで検索（例：首吊り線、移動平均線）" autocomplete="off" />
    </div>
    <div id="filter-bar" class="filter-bar"></div>
  </header>

  <main>
    <section id="list-view">
      <p class="result-count"><span id="result-count"></span>の知識</p>
      <div id="cards" class="cards"></div>
      <p id="empty-state" class="empty-state" hidden>該当する知識が見つかりませんでした。</p>
    </section>

    <section id="detail-view" hidden>
      <button id="back-btn" class="back-btn">← 一覧に戻る</button>
      <div id="detail-body" class="detail-body"></div>
    </section>
  </main>

  <footer class="app-footer">
    <p>チャート知識帳 - オフラインでも使えるチャート学習アプリ</p>
  </footer>

<script src="svg.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
